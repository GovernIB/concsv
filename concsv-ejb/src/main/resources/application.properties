# Propietats del context Spring de la capa d'EJBs (només en mode JBoss). La resta de propietats
# surten dels fitxers es.caib.concsv.properties i es.caib.concsv.system.properties.
spring.main.web-application-type=NONE
spring.main.allow-circular-references=true

spring.datasource.jndi-name=java:jboss/datasources/concsvDS
spring.datasource.initialization-mode=never

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.root=INFO
