# Dades de la compilació, filtrades per Maven (delimitador @...@ del spring-boot-starter-parent). /manifest les serveix quan l'aplicació s'executa sense
# WAR (ConcsvBackBootApp des del codi font), on no hi ha cap META-INF/MANIFEST.MF (veure
# ReactController.manifest). Són les mateixes entrades que el maven-war-plugin escriu al manifest.
Implementation-Title=@project.artifactId@
Implementation-Version=@project.version@
Build-Timestamp=@maven.build.timestamp@
Implementation-SCM-Branch=@scmBranch@
Implementation-SCM-Revision=@buildNumber@
